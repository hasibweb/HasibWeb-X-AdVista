services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      SERVICE_FQDN_APP_3000: https://advista.hasibweb.com
      DATABASE_URL: postgresql://advista:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/advista
      ADMIN_PASSWORD: ${SERVICE_PASSWORD_ADMIN}
      AUTH_SECRET: ${SERVICE_REALBASE64_64_AUTH}
      AUTH_COOKIE_SECURE: true
      HASIBWEB_WA_BASE_URL: ${HASIBWEB_WA_BASE_URL:-https://wa.hasibweb.com}
    expose:
      - '3000'
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:3000/api/health']
      interval: 20s
      timeout: 5s
      retries: 8

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: advista
      POSTGRES_USER: advista
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
